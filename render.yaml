services:
  - type: web
    name: psyconnect-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: NODE_ENV
        value: production
      - key: PSYCONNECT_DEMO_MODE
        value: true

  - type: web
    name: psyconnect-web
    runtime: static
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && BASE_PATH=/ PORT=3000 pnpm --filter @workspace/psyconnect run build
    staticPublishPath: artifacts/psyconnect/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: VITE_API_BASE_URL
        sync: false
